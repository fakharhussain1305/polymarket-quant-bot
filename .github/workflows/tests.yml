name: Tests

on:
  push:
    paths: ['**.py', 'requirements*.txt', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Ledger replay runs from a clean checkout
        run: python analyze_portfolio.py
