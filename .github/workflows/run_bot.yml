name: Trading Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'trade'
        type: choice
        options:
          - trade
          - snapshot

permissions:
  contents: write

jobs:
  trade:
    if: github.event_name == 'schedule' || inputs.job == 'trade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
        run: python main.py
      - name: Commit updated state
        run: |
          git config --global user.name "QuantBot-Automation"
          git config --global user.email "bot@github.com"
          for f in paper_trades.csv market_cooldowns.json position_tokens.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff-index --quiet HEAD || git commit -m "Automated state update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  snapshot:
    if: inputs.job == 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run P&L snapshot
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
        run: python pnl_snapshot.py
